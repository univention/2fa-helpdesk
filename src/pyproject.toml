[tool.poetry]
name = "2fa-helpdesk"
version = "0.1.0"
description = "Univention 2FA Helpdesk - Additional tools for the administration of two factor authentication"
authors = [
  "Univention GmbH <packages@univention.de>",
]
license = "GNU Affero General Public License v3"
# packages = [{ include = "server", from = "src" }, ]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.34.2"
python-keycloak = "^7.1.1"
udm-rest-api-client = "^0.1.2"
pyJWT = "^2.13.0"
uvicorn = "^0.52.0"
fastapi = "^0.141.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
urllib3 = ">=2.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
extend-select = ["COM", "E501"]
exclude = [
    "archive/",
    "helper_scripts/",
]
