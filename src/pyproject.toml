[project]
name = "2fa-helpdesk"
version = "0.1.0"
description = "Univention 2FA Helpdesk - Additional tools for the administration of two factor authentication"
authors = [
  {name = "Univention GmbH", email = "packages@univention.de"},
]
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"

dependencies = [
  "python-keycloak>=7.1.1,<8",
  "pyjwt>=2.13.0,<3",
  "uvicorn>=0.52.0,<0.53",
  "fastapi>=0.141.0,<0.142",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  # Floors below are CVE fixes, not features. The packages above pull them in.
  "urllib3>=2.7.0",
  "starlette>=1.3.1",
  "cryptography>=50.0.0",
]

[tool.uv]
# The import package directory is "2fa_helpdesk", which no Python identifier can
# name, so there is nothing to build a wheel from yet. uv installs the
# dependencies only and the Dockerfile copies the sources.
package = false

[tool.ruff]
line-length = 100
extend-select = ["COM", "E501"]
exclude = [
    "archive/",
    "helper_scripts/",
]
