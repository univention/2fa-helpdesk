[project]
name = "2fa-helpdesk"
version = "0.1.0"
description = "Univention 2FA Helpdesk - Additional tools for the administration of two factor authentication"
authors = [
  {name = "Univention GmbH", email = "packages@univention.de"},
]
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"

dependencies = [
  # CVE floor, pulled in by python-keycloak through jwcrypto.
  "cryptography>=50.0.0",
  "fastapi<1.0.0,>=0.141.0",
  # Switches uvicorn off the pure-Python h11 parser, as in
  # provisioning@jlohmer/small-sbom -- do not drop.
  "httptools<1.0.0,>=0.8.0",
  "pydantic<3.0.0,>=2.13.4",
  "pydantic-settings<3.0.0,>=2.14.2",
  "pyjwt<3.0.0,>=2.13.0",
  "python-keycloak<8.0.0,>=7.1.1",
  # CVE floor, pulled in by fastapi.
  "starlette>=1.3.1",
  # CVE floor, pulled in by python-keycloak through requests.
  "urllib3>=2.7.0",
  "uvicorn<1.0.0,>=0.52.0",
  "uvloop>=0.22.1",
]

[tool.uv]
# The import package directory is "2fa_helpdesk", which no Python identifier can
# name, so there is nothing to build a wheel from yet. uv installs the
# dependencies only and the Dockerfile copies the sources.
package = false

[tool.ruff]
line-length = 100
extend-select = ["COM", "E501"]
exclude = [
    "archive/",
    "helper_scripts/",
]
