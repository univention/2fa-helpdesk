---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/generate-filesystem-sbom.yaml"
      - "templates/sonarqube.yaml"
      - "templates/compose-test.yaml"
  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.72.0"

variables:
  RENOVATE_USER_ID: "1393"

.build-matrix: &build-matrix
  - IMAGE_NAME:
      - "twofa-helpdesk-backend"
      - "twofa-helpdesk-extensions"
      - "twofa-helpdesk-frontend"
  - IMAGE_NAME: "twofa-helpdesk-frontend-testrunner"
    DOCKERFILE_PATH: "docker/twofa-helpdesk-frontend/Dockerfile"
    BUILD_CONTEXT: "${CI_PROJECT_DIR}"
    BUILD_TARGET: "base"
  - IMAGE_NAME: "testrunner"
    DOCKERFILE_PATH: "docker/testrunner/Dockerfile"
    BUILD_CONTEXT: "${CI_PROJECT_DIR}/docker/testrunner"
.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "twofa-helpdesk-backend"
      - "twofa-helpdesk-frontend"
      - "twofa-helpdesk-extensions"

generate-filesystem-sbom:
  variables:
    FOLDER: "frontend"

container-build:
  parallel:
    matrix: *build-matrix
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR"
    DOCKERFILE_PATH: "docker/${IMAGE_NAME}/Dockerfile"

container-malware-scan:
  parallel:
    matrix: *publish-matrix
container-sign-external:
  parallel:
    matrix: *build-matrix

push-image-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *publish-matrix

sbom-upload:
  parallel:
    matrix: *publish-matrix

test-chart:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.24@sha256:1f34d54d23452475db4e92a43b669b8cb1817c4837b0003b2d897d47ed2f9d35"
  script:
    - helm dep build helm/twofa-helpdesk
    - pytest -W error -v tests/chart

test-backend-unit:
  stage: test
  needs: []
  image: "ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie@sha256:6299696d13e91e9d58e910fca4e503e89f217229a2c4c840a11b367dc24816f4"
  variables:
    UV_PROJECT_ENVIRONMENT: "/opt/venv"
  script:
    # pytest reads its config from src/pyproject.toml, so it has to run there.
    - cd src
    - uv run --frozen pytest tests -lvv --junit-xml=pytest-junit.xml
  artifacts:
    reports:
      junit: "src/pytest-junit.xml"
    expire_in: "1 day"
    when: "always"

test-frontend-unit:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/twofa-helpdesk-frontend-testrunner:${RELEASE_VERSION}"
  script:
    - cd /app
    - pnpm test

test-backend:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_PROFILES: "test-it-services"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run --quiet-pull --rm testrunner bash -c 'pytest -lvv tests/integration/api-2fa'

test-e2e:
  extends: ".compose-test"
  stage: test
  variables:
    COMPOSE_PROFILES: "test-e2e-services"
    COMPOSE_TEST_WAIT_TIMEOUT: "180"
  script:
    - docker compose run --quiet-pull --rm testrunner bash -c 'pytest -lvv tests/integration/e2e'

sonarqube:
  extends: .sonarqube
  needs: []
